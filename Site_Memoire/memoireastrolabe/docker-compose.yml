services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: symfony_php
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - .:/var/www/html
    # Permet de conserver les droits d'écriture sur var/ et vendor/
    user: "${UID:-1000}:${GID:-1000}"

  nginx:
    image: nginx:alpine
    container_name: symfony_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  node:
    image: node:18-alpine
    container_name: symfony_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # Lance la compilation Webpack Encore en tâche de fond
    command: sh -c "npm install && npm run watch"

  dozzle:
    image: amir20/dozzle:latest
    container_name: symfony_dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8080" # Nginx utilise déjà le 8080, Dozzle sera sur le 8090
